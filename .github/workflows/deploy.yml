name: Deploy Website to AWS EC2

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0

        with:
          role-to-assume: arn:aws:iam::573011045479:role/github-actions-ec2-deploy-role
          aws-region: ap-south-1

      - name: Find EC2 instance
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=ubuntu-nginx-web-server" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

          echo "Deploying to EC2 instance: $INSTANCE_ID"

      - name: Deploy website using SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy website from GitHub" \
            --parameters 'commands=[
              "set -e",
              "cd /opt/website",
              "git fetch origin main",
              "git reset --hard origin/main",
              "rsync -av --delete --exclude=.git/ /opt/website/ /var/www/html/",
              "chown -R www-data:www-data /var/www/html",
              "systemctl reload nginx"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.ec2.outputs.instance_id }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.ec2.outputs.instance_id }}"